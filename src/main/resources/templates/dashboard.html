<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas Personales</title>
    <!-- Tailwind CSS CDN para prototipado rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accentNeon: '#10b981',
                        accentPurple: '#6366f1'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-darkBg text-slate-100 min-h-screen font-sans pb-20">

    <!-- Header -->
    <header class="p-5 flex justify-between items-center border-b border-slate-800">
        <div>
            <h1 class="text-xl font-bold">Hello, <span class="text-accentNeon"
                    th:text="${usuarioNombre}">Usuario</span>!</h1>
            <p class="text-xs text-slate-400">Resumen de tus cuentas</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center font-bold text-accentNeon">
            L
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-6">

        <!-- Balance Total Card -->
        <div class="bg-cardBg p-5 rounded-2xl border border-slate-800 shadow-xl text-center space-y-2">
            <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Balance Total</span>
            <div class="text-3xl font-extrabold text-accentNeon">$4,200.00</div>
            <p class="text-xs text-slate-500">Saldo Consolidado MultiMoney</p>
        </div>

        <!-- Botón Principal de Acción -->
        <button
            class="w-full bg-accentPurple hover:bg-indigo-600 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center space-x-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            <span>Registrar Movimiento</span>
        </button>

        <!-- Listado Dinámico de Bancos y Categorías -->
            <div class="space-y-6" th:each="banco : ${bancos}">

                <!-- Tarjeta del Banco -->
                <div class="bg-cardBg p-4 rounded-2xl border border-slate-800 space-y-3">
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="font-bold text-base" th:text="${banco.nameBank}">Banco</h2>
                            <span class="text-xs text-slate-400"
                                th:text="'Tasa: ' + ${banco.yearInterest} + '% Anual'">Tasa</span>
                        </div>
                        <a th:href="@{/categorias/nueva}"
                            class="text-xs bg-accentPurple/20 text-accentPurple px-3 py-1.5 rounded-lg font-medium hover:bg-accentPurple/30 transition">
                            + Categoría
                        </a>
                    </div>

                    <!-- Categorías de este banco -->
                    <div class="space-y-2 pt-2 border-t border-slate-800">
                        <div th:if="${banco.categoryList.empty}" class="text-xs text-slate-500 text-center py-2">
                            No hay categorías registradas en esta entidad.
                        </div>

                        <div th:each="cat : ${banco.categoryList}"
                            class="bg-slate-900/50 p-3 rounded-xl flex justify-between items-center border border-slate-800/60">
                            <div>
                                <h3 class="font-medium text-sm text-slate-200" th:text="${cat.nameCategory}">Categoría
                                </h3>
                                <span class="text-xs text-slate-400" th:text="'$' + ${cat.actualBalance}">$0.00</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Botón Agregar Banco -->
            <a href="/financesaccount/bancos/nuevo"
                class="block text-center w-full py-3 border border-dashed border-slate-700 text-slate-400 rounded-xl text-xs hover:border-slate-500">
                + Agregar Nueva Entidad Bancaria
            </a>
    </main>

    <!-- Navegación Inferior (Barra Fija) -->
    <nav
        class="fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-800 py-3 px-6 flex justify-around text-xs text-slate-400">
        <a href="#" class="text-accentNeon flex flex-col items-center">
            <span>Inicio</span>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-slate-200">
            <span>Entidades</span>
        </a>
        <a href="#" class="flex flex-col items-center hover:text-slate-200">
            <span>Reportes</span>
        </a>
    </nav>

</body>

</html>
